services:
  # PHP-APACHE
  www:
    build: docker
    container_name: www_karukera
    ports:
      - "8001:80"
    volumes:
      - ./docker/vhosts:/etc/apache2/sites-enabled
      - ./:/var/www
    networks:
      - dev
    environment:
      MAILER_DSN: 'smtp://contact%40oasiskarurio.com:oasiskarurio@ssl0.ovh.net:465'
      ADMIN_EMAIL: "contact@oasiskarurio.com"
      MAILER_FROM_ADDRESS: "contact@oasiskarurio.com"

  db:
    image: mysql
    container_name: mysql_karukera
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    networks:
      - dev

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmnin
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
    networks:
      - dev

networks:
  dev:

volumes:
  db-data:
