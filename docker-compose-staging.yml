version: '3'

services:
   #PHP-APACHE
  www:
    build: docker
    image: karukera-www-staging
    container_name: www_karukera_staging
    #ports:
      #- "8000:80"
    volumes:
      - ./docker/vhosts:/etc/apache2/sites-enabled
      - ./:/var/www
    networks:
      - dev
    
  db:
    image: mysql
    container_name: mysql_karukera_staging
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    networks:
      - dev

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmnin_staging
    depends_on:
      - db
    #ports:
      #- 8080:80
    environment:
      PMA_HOST: db
    networks:
      - dev

 

networks:
  dev:
     external: true
     name: karukera_dev

volumes:
  db-data:
